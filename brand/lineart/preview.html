const g = document.getElementById('g');
const els = SPEC.map(p => {
  const el = document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('d', p.d);
  el.setAttribute('stroke-width', p.w);
  g.appendChild(el);
  const L = el.getTotalLength();
  el.style.strokeDasharray = L;
  return {el, L, start:p.start, end:p.end};
});
// ease so the pen starts and settles gently, but holds a steady speed in between
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function render(p){
  const e = ease(Math.min(Math.max(p,0),1));
  for (const s of els){
    const f = Math.min(Math.max((e - s.start)/(s.end - s.start), 0), 1);
    s.el.style.strokeDashoffset = s.L * (1 - f);
  }
}
let raf=null, t0=0, dur=2600;
function play(){
  cancelAnimationFrame(raf); t0=performance.now();
  (function step(now){
    const p=(now-t0)/dur; render(p);
    document.getElementById('scrub').value = Math.min(p,1)*1000;
    if(p<1) raf=requestAnimationFrame(step);
  })(t0);
}
document.getElementById('replay').onclick=play;
document.getElementById('dur').oninput=e=>{
  dur=+e.target.value; document.getElementById('durv').textContent=dur+'ms';};
document.getElementById('scrub').oninput=e=>{cancelAnimationFrame(raf); render(+e.target.value/1000);};
render(1); setTimeout(play, 350);
</script>
