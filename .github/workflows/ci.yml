name: CI

# The three checks that were only ever run by hand. Two of them — the parity
# tests between captionTimeline.ts / captions.py and climaxScoring.ts /
# scoring_algorithm.py — exist specifically to catch drift between the app and
# the Python reference implementations, which is exactly the kind of drift a
# check nobody remembers to run does not catch.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in app/package.json.
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  server:
    name: Server (captioning + climax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check the reference implementations
        # Neither service has a test suite of its own; the parity assertions
        # live in the app's Jest run. This is the cheapest check that still
        # catches a syntax error in the code those fixtures are generated from.
        run: python -m compileall -q server/captioning server/climax
